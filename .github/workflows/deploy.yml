# Deploys the judge site (judge-site/, served at interfacewars.pallabdas.me) after CI passes on main.
# Render auto-deploy is off. A delayed CI run retains a newer live release. After calling the hook,
# the job waits for version.json to name the exact requested commit.
name: deploy

on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-judge-site
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      SITE: https://interfacewars.pallabdas.me
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Deploy the selected commit and verify the live revision
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: node scripts/deploy-judge-site.mjs

      - name: Check the published pages and data
        run: |
          for path in / /readout.json /meta.json /trials.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE$path")
            echo "$path $code"
            [ "$code" = 200 ] || exit 1
          done
          curl -fsS "$SITE/readout.json" | jq -e '(.perArm | length) == 3 and .trials > 0' > /dev/null
