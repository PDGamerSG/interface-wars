# Starts the self-hosted Flagsmith lab, proves the verifier on all 16 jobs with the reference solutions, and
# runs the full trial pipeline with the scripted dry-run agent (no API key, no model calls).
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests (statistics, decision rule, verifier, cost, recorded trials)
        run: npm test

      - name: Credential scan of every tracked file (trial records, web export, docs, code)
        run: npm run scan:secrets

  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - name: Build the CLI sandbox image
        run: docker build -t interface-wars-cli:2.0.0 -f infra/cli.Dockerfile infra

      - name: Start Flagsmith, task processor, Postgres and the MCP server
        run: docker compose -p interface-wars -f infra/compose.yml up -d

      - name: Bootstrap the lab
        run: node src/lab/bootstrap.ts

      - name: Verifier self-test (16 jobs)
        run: node src/jobs/selftest.ts

      - name: Dry-run pipeline (all three arms, scripted agent)
        env:
          IW_DRY_RUN: '1'
        run: node src/run.ts --run ci --count 6 --pilot --concurrency 3

      - name: Rebuild the committed readout offline and check the web export for credentials
        run: |
          node src/cli.ts readout main --offline > /dev/null
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const read = (name) => JSON.parse(readFileSync('runs/main/' + name, 'utf8'));
          const { generatedAt: originalTime, ...published } = read('readout.json');
          const { generatedAt: replayTime, ...replayed } = read('readout.offline.json');
          assert.deepEqual(replayed, published);
          JS
          git diff --exit-code -- runs/main/readout.json runs/main/readout.md
          node scripts/sensitivity.ts | diff -u runs/main/sensitivity.md -
          node scripts/export-web-data.ts main --out "$RUNNER_TEMP/web-data"
          diff -ru web/public/data "$RUNNER_TEMP/web-data"

      - name: Flagsmith logs on failure
        if: failure()
        run: docker compose -p interface-wars -f infra/compose.yml logs --tail 200
